name: flutter_apothicare
description: "Apothicare - Solution Mobile Santé & Géopharmacie CNOPT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  font_awesome_flutter: ^10.7.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0

  # State Management & Architecture
  provider: ^6.1.1
  
  # Network & API
  dio: ^5.4.0
  http: ^1.2.0

  # Local Storage & Preferences
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Geolocation & Maps
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3
  google_maps_flutter_android: ^2.14.8
  google_maps_flutter_web: ^0.5.4+3
  google_maps_flutter_platform_interface: ^2.4.1
  url_launcher: ^6.2.4

  # Device Hardware & Utilities
  mobile_scanner: 7.0.0
  image_picker: ^1.0.7
  intl: ^0.20.3
  flutter_animate: ^4.5.0
  lucide_icons_flutter: ^3.1.21
  qr_flutter: ^4.1.0
  video_player: ^2.14.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.0
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_white.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
